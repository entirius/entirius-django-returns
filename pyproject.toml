[project]
name = "entirius-django-returns"
version = "3.0.0"
description = "Order returns (RMA) for Entirius checkout: return requests, attachments and PDF return forms"
keywords = ["django", "returns", "rma", "orders", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "marshmallow",
    "marshmallow-dataclass[enum, union]",
    "django-admin-inline-paginator>=0.3.0",
    "entirius-django-checkout>=9.0.0",
    "entirius-django-email>=4.0.0",
    "entirius-django-utils>=2.0.0",
    # schema-only: FK OrderReturn.customer -> django_accounts.Customer (no Python import)
    "entirius-django-accounts>=5.0.0",
    "entirius-py-pdf-generator>=2.0.0",
    "entirius-py-bievents>=2.0.0",
    "entirius-py-process-logger>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "dj-database-url", "psycopg[binary]"]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-returns/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-returns"
Changelog = "https://github.com/entirius/entirius-django-returns/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-returns/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_returns"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S108"]
# Legacy migrated 1:1
"src/django_returns/models/*.py" = ["DJ001"]
"src/django_returns/views/*.py" = ["B904", "F841"]
"src/django_returns/domain/dto/order_return.py" = ["E731"]

[tool.ruff.lint.isort]
known-first-party = ["django_returns"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]

[tool.deptry.per_rule_ignores]
# DEP002: django_accounts is a schema-only dependency (FK string-ref), never imported in Python
DEP002 = ["entirius-django-accounts"]
